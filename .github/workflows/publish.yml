name: Publish Quarto website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Catalan documentation
        run: quarto render docs/ca

      - name: Render English documentation
        run: quarto render docs/en

      - name: Render Spanish documentation
        run: quarto render docs/es

      - name: Assemble multilingual site
        shell: bash
        run: |
          mkdir -p site/ca site/en site/es
          cp -R docs/ca/_site/. site/ca/
          cp -R docs/en/_site/. site/en/
          cp -R docs/es/_site/. site/es/
          cp docs/landing/index.html site/index.html
          touch site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
