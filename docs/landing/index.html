<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H2OSEG-Ter</title>
  <script>
    const requestedLanguage = new URLSearchParams(window.location.search).get("lang");
    const browserLanguage = (navigator.language || "ca").slice(0, 2).toLowerCase();
    const supportedLanguages = ["ca", "en", "es"];
    const language = supportedLanguages.includes(requestedLanguage)
      ? requestedLanguage
      : (supportedLanguages.includes(browserLanguage) ? browserLanguage : "ca");
    window.location.replace(`./${language}/`);
  </script>
</head>
<body>
  <p>
    <a href="./ca/">Català</a> ·
    <a href="./en/">English</a> ·
    <a href="./es/">Español</a>
  </p>
</body>
</html>
