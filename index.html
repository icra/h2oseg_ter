<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Exemple Cytoscape + Leaflet amb Vue 3</title>
    <!-- Estils de Leaflet -->
    <link rel="stylesheet" href="css/leaflet.css" />
    <!-- Estils de cytoscape-leaf -->
    <link rel="stylesheet" href="css/cytoscape-leaf.css" />
    <link rel="stylesheet" href="css/custom_styles.css" />
</head>
<body>
<div id="app">
    <div class="layout">
        <div id="map-wrapper">
            <div id="cy"></div>
            <div id="cy-leaflet"></div>
        </div>
        <div id="sidebar">
            Aquí hi aniran totes les opcions per interactuar amb la visualització de xarxes.

            <div v-if="selectedNode">
                <h4>Dades del node seleccionat:</h4>
                <ul>
                    <li><strong>ID:</strong> {{ selectedNode.id }}</li>
                    <li><strong>Lat:</strong> {{ selectedNode.lat ?? '-' }}</li>
                    <li><strong>Lng:</strong> {{ selectedNode.lng ?? '-' }}</li>
                </ul>
            </div>
            <div v-else>
                <p>Fes clic sobre un node per veure’n les dades.</p>
            </div>
        </div>
    </div>
</div>

<!-- Llibreries necessàries -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/cytoscape.min.js"></script>
<script src="js/cytoscape-leaf.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
